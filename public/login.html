<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to TaskPulse.">
  <title>Sign in · TaskPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-head">
        <div class="brand-mark" aria-hidden="true">⚡</div>
        <h1>Welcome back</h1>
        <p>Sign in to pick up where you left off.</p>
      </div>

      <div id="form-alert" class="alert"></div>

      <form id="auth-form" data-mode="login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 placeholder="you@example.com" required autofocus>
          <div class="field-feedback" data-feedback-for="email"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-affix">
            <input type="password" id="password" name="password"
                   autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="affix-btn" data-toggle-password="password"
                    aria-label="Show password" aria-pressed="false">👁</button>
          </div>
          <div class="field-feedback" data-feedback-for="password"></div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">
          <span class="btn-label">Sign in</span>
        </button>
      </form>

      <div class="demo-note">
        Trying it out? <button id="demo-fill" type="button"
          style="background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0">Use the demo account</button>
        <br><code>demo@taskpulse.app · demo1234</code>
      </div>

      <p class="auth-foot">
        Don't have an account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/auth-forms.js"></script>
</body>
</html>
